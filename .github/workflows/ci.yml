# Pixel mismatchPct blocks on ubuntu-latest only (SPEC.md section 5). Windows runs install,
# --help, Gate 1, the scenario runner, and the section 6 schema, and reports mismatchPct
# without that pixel bar. Playwright is pinned to 1.65.1. M1-AC-01..15 are the green suite.
# M2-AC-01..37 stay unchecked gap criteria. Five break-its (M2-AC-02, 04, 05, 18, 21) are
# enforced as green { title, suite: "pass" } tests under those unchecked criteria.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Verify pixel-gate CLI help
        run: node tools/pixel-perfect-gate/bin/pixel-gate.mjs --help
      - name: Run pre-flight verifier and package tests
        run: node scripts/verify.mjs
      - name: Fetch base branch for acceptance-test diff
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.base_ref }}
      - name: Verify PR readiness and SPEC parity
        if: github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/verify-pr-ready.mjs
