# Pixel mismatchPct blocks on ubuntu-latest only (SPEC.md section 5). Windows runs install,
# --help, Gate 1, the scenario runner, and the section 6 schema, and reports mismatchPct
# without that pixel bar. Playwright is pinned to 1.65.1. M1-AC-01..15 and M2-AC-01..37
# are the green suite. M2b-AC-01..59 and M3-AC-01..03 stay unchecked gap criteria.
# M3-AC-04 is green. Five M2b break-its (M2b-AC-19, M2b-AC-23, and three M2b-AC-59
# directions) are enforced as green { title, suite: "pass" } tests under those unchecked
# criteria. No M3 break-it is registered that way.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Install pixel-gate CLI and skill links
        shell: bash
        run: |
          node tools/pixel-perfect-gate/scripts/install.mjs --skip-chromium --bin-dir "${{ github.workspace }}/.ci-bin"
          echo "${{ github.workspace }}/.ci-bin" >> "$GITHUB_PATH"
      - name: Verify global pixel-gate --help
        run: pixel-gate --help
      - name: Run pre-flight verifier and package tests
        run: node scripts/verify.mjs
      - name: Fetch base branch for acceptance-test diff
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.base_ref }}
      - name: Verify PR readiness and SPEC parity
        if: github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/verify-pr-ready.mjs
