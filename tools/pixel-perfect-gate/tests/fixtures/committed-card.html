<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 480px; height: 280px; background: #0f172a; display: flex; align-items: center; justify-content: center; }
    .card { width: 400px; height: 200px; background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .bar-top { width: 96px; height: 20px; background: #3b82f6; border-radius: 6px; }
    .bar-mid { width: 280px; height: 24px; background: #f8fafc; border-radius: 4px; }
    .bar-sub { width: 220px; height: 14px; background: #64748b; border-radius: 4px; }
    .btn-block { width: 100%; height: 36px; background: #22c55e; border-radius: 8px; margin-top: auto; }
  </style>
</head>
<body>
  <div class="card">
    <div class="bar-top"></div>
    <div class="bar-mid"></div>
    <div class="bar-sub"></div>
    <div class="btn-block"></div>
  </div>
</body>
</html>
