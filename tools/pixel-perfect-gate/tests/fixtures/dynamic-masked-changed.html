<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; width: 480px; height: 280px; padding: 16px; color: #fff; }
    .card { background: #1e293b; border-radius: 8px; padding: 16px; }
    #dyn { margin-top: 10px; background: #ef4444; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Static Title</h2>
    <div id="dyn">Dynamic: MODIFIED</div>
  </div>
</body>
</html>
