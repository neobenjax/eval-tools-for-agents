<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 480px; min-height: 500px; background: #0f172a; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .section { width: 440px; height: 220px; background: #1e293b; border: 2px solid #334155; border-radius: 10px; }
    .accent { background: #1d4ed8; border-color: #60a5fa; }
  </style>
</head>
<body>
  <div class="section"></div>
  <div class="section accent"></div>
</body>
</html>
