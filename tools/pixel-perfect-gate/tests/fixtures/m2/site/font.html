<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>m2 pinned font</title>
<style>
  /* Pinned, committed font file (fonts/codicon.ttf). The test server delays it, so a capture that
     does not wait for document.fonts.ready shows the fallback and not the plus glyph. */
  @font-face { font-family: Pinned; src: url(fonts/codicon.ttf) format('truetype'); }
  html, body { margin: 0; background: #fff; }
  #glyph { font-family: Pinned, monospace; font-size: 240px; line-height: 300px; height: 300px; text-align: center; color: #111; }
</style>
<div id="glyph">&#xea60;</div>
