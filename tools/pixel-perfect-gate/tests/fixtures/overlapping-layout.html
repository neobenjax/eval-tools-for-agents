<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; width: 480px; height: 280px; padding: 16px; }
    .overlap-container { position: relative; width: 200px; height: 100px; }
    .box-a { position: relative; width: 80px; height: 40px; background: #3b82f6; }
    .box-b { position: relative; top: -20px; width: 80px; height: 40px; background: #ef4444; }
  </style>
</head>
<body>
  <div class="overlap-container">
    <div class="box-a">Box A</div>
    <div class="box-b">Box B</div>
  </div>
</body>
</html>
