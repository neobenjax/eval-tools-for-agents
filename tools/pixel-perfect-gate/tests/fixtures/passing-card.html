<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; display: flex; align-items: center; justify-content: center; width: 480px; height: 280px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 28px; width: 400px; }
    .badge { display: inline-block; background: rgba(59,130,246,0.15); color: #60a5fa; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; margin-bottom: 14px; }
    h1 { color: #f8fafc; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    button { background: #3b82f6; color: #ffffff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">PRO PLAN</span>
    <h1>Deploy Faster</h1>
    <p>Ship pixel-accurate interfaces with automated visual regression checks.</p>
    <button type="button">Start Free Trial</button>
  </div>
</body>
</html>
