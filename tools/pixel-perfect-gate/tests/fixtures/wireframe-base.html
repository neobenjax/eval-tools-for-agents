<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 480px; height: 280px; background: #0f172a; position: relative; font-family: monospace; }
    header { position: absolute; left: 16px; top: 16px; width: 448px; height: 40px; background: #1e293b; color: #f8fafc; padding: 10px; }
    nav { position: absolute; left: 16px; top: 68px; width: 120px; height: 152px; background: #1e293b; color: #94a3b8; padding: 10px; }
    main { position: absolute; left: 148px; top: 68px; width: 316px; height: 152px; background: #1e293b; color: #f8fafc; padding: 10px; }
    footer { position: absolute; left: 16px; top: 232px; width: 448px; height: 32px; background: #1e293b; color: #94a3b8; padding: 8px; }
  </style>
</head>
<body>
  <header>Header</header>
  <nav>Nav</nav>
  <main>Main Content</main>
  <footer>Footer</footer>
</body>
</html>
