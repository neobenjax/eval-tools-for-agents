<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 480px; height: 280px; background: #ffffff; position: relative; font-family: monospace; }
    header { position: absolute; left: 16px; top: 16px; width: 448px; height: 40px; background: #dbeafe; color: #1e3a8a; border: 2px solid #3b82f6; padding: 10px; }
    nav { position: absolute; left: 16px; top: 68px; width: 120px; height: 152px; background: #dcfce7; color: #14532d; border: 2px solid #22c55e; padding: 10px; }
    main { position: absolute; left: 148px; top: 68px; width: 316px; height: 152px; background: #fef3c7; color: #78350f; border: 2px solid #f59e0b; padding: 10px; }
    footer { position: absolute; left: 16px; top: 232px; width: 448px; height: 32px; background: #f3e8ff; color: #581c87; border: 2px solid #a855f7; padding: 8px; }
  </style>
</head>
<body>
  <header>Header</header>
  <nav>Nav</nav>
  <main>Main Content</main>
  <footer>Footer</footer>
</body>
</html>
