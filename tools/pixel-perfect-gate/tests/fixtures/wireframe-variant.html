<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background: #ffffff; display: flex; align-items: center; justify-content: center; width: 480px; height: 280px; }
    .card { border: 2px dashed #64748b; border-radius: 16px; padding: 28px; width: 400px; }
    .badge { display: inline-block; border: 1px solid #64748b; font-size: 12px; padding: 4px 10px; margin-bottom: 14px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    button { border: 1px solid #0f172a; background: #e2e8f0; padding: 10px 18px; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">PRO PLAN</span>
    <h1>Deploy Faster</h1>
    <p>Wireframe structural layout check.</p>
    <button type="button">Start Free Trial</button>
  </div>
</body>
</html>
